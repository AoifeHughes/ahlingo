site_name: AHLingo Documentation
site_description: Comprehensive documentation for the AHLingo language learning platform
site_author: AHLingo Team

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - navigation.top
    - navigation.tracking
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Content Generation:
    - Architecture: generation/architecture.md
    - Core Concepts: generation/core-concepts.md
  - Mobile App:
    - Architecture: mobile/architecture.md
    - Database: mobile/database.md
  - Integration:
    - Content Pipeline: integration/content-pipeline.md
    - Versioning: integration/versioning.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/ahlingo
