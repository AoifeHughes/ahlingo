name: Tests

# This suite requires a running local LLM server (see content/tests/test_generation_integration.py),
# so it isn't runnable on a standard GitHub-hosted runner. Kept as a manual trigger for whoever
# has a server available to run against.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: pytest content/tests
